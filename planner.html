<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h1 class="text-center mb-4">Simple Budget Planner</h1>
    <div class="card p-4 shadow">
      <form>
        <div class="mb-3">
          <label for="income" class="form-label">Monthly Income:</label>
          <input type="number" class="form-control" id="income" placeholder="Enter your income">
        </div>
        <div class="mb-3">
          <label for="expense" class="form-label">Add Expense:</label>
          <input type="number" class="form-control" id="expense" placeholder="Enter an expense">
        </div>
        <button type="button" class="btn btn-primary mb-3" onclick="addExpense()">Add Expense</button>
        <div class="mb-3">
          <p><strong>Total Expenses:</strong> <span id="totalExpenses">0</span></p>
          <p><strong>Remaining Balance:</strong> <span id="balance">0</span></p>
        </div>
      </form>
    </div>
  </div>

  <script>
    let totalExpenses = 0;

    function addExpense() {
      const income = parseFloat(document.getElementById('income').value) || 0;
      const expense = parseFloat(document.getElementById('expense').value) || 0;

      totalExpenses += expense;
      const balance = income - totalExpenses;

      document.getElementById('totalExpenses').textContent = totalExpenses.toFixed(2);
      document.getElementById('balance').textContent = balance.toFixed(2);

      document.getElementById('expense').value = ''; // Clear expense input
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
