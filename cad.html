            <h1 class="text-center mb-4">Your Dream home design!</h1>

            <div class="cad-toolbar">
                <button class="btn btn-outline-primary" onclick="drawRect()">Draw Rectangle</button>
                <button class="btn btn-outline-primary" onclick="drawCircle()">Draw Circle</button>
                <button class="btn btn-outline-secondary" onclick="clearCanvas()">Clear</button>

    <script src="js/main.js"></script>
    <script>
        // Simple CAD canvas drawing logic
        const canvas = document.getElementById('cad-canvas');
        const ctx = canvas.getContext('2d');

        function drawRect() {
            ctx.fillStyle = "#007bff";
            ctx.fillRect(100, 100, 200, 150);
        }

        function drawCircle() {
            ctx.beginPath();
            ctx.arc(500, 300, 75, 0, 2 * Math.PI);
            ctx.fillStyle = "#28a745";
            ctx.fill();
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
